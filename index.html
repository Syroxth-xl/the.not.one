<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The not ONE</title>
    <!-- Import d'une police brute / typewriter style -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #030303;
            color: #F5F5F7;
            font-family: 'Courier Prime', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        #intro-screen {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 2s ease-out, visibility 2s ease-out;
        }

        /* Texte qui part de l'infiniment petit et invisible */
        #intro-text {
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 400;
            letter-spacing: 0.4em;
            color: #E0E0E0;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
            opacity: 0;
            transform: scale(0.01);
            animation: emergeFromVoid 7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        #intro-text span {
            font-weight: 700;
            letter-spacing: 0.5em;
            color: #FFFFFF;
            text-shadow: 0 0 35px rgba(255, 255, 255, 0.4);
        }

        /* Animation lente : surgit de nulle part et grandit jusqu'à sa taille normale */
        @keyframes emergeFromVoid {
            0% {
                opacity: 0;
                transform: scale(0.005);
                filter: blur(15px);
            }
            15% {
                opacity: 0.2;
                filter: blur(8px);
            }
            50% {
                opacity: 1;
                filter: blur(0px);
            }
            85% {
                opacity: 1;
                transform: scale(1);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(1.15);
                filter: blur(8px);
            }
        }

        #void-content {
            text-align: center;
            opacity: 0;
            transition: opacity 2.5s ease-in;
            padding: 20px;
        }

        #void-content.visible {
            opacity: 1;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #444444;
            letter-spacing: 0.25em;
            margin-bottom: 2.5rem;
        }

        .replay-btn {
            background: transparent;
            border: 1px solid #1a1a1a;
            color: #555555;
            padding: 8px 18px;
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
      v      cursor: pointer;
            transition: all 0.4s ease;
        }

        .replay-btn:hover {
            border-color: #E0E0E0;
            color: #E0E0E0;
            box-shadow: 0 0 15px rgba(245, 245, 247, 0.1);
        }
    </style>
</head>
<body>

    <div id="intro-screen">
        <h1 id="intro-text">The not <span>ONE</span></h1>
    </div>

    <main id="void-content">
        <p class="subtitle">[ 0x00 — NOTHING HERE ]</p>
        <button class="replay-btn" onclick="replayIntro()">REPLAY</button>
    </main>

    <script>
        const introScreen = document.getElementById('intro-screen');
        const introText = document.getElementById('intro-text');
        const voidContent = document.getElementById('void-content');

        function startSequence() {
            // Correspond à la durée totale avant la disparition (environ 6.5 secondes)
            setTimeout(() => {
                introScreen.style.opacity = '0';
                introScreen.style.visibility = 'hidden';
                voidContent.classList.add('visible');
            }, 6500);
        }

        function replayIntro() {
            voidContent.classList.remove('visible');
            introScreen.style.visibility = 'visible';
            introScreen.style.opacity = '1';

            introText.style.animation = 'none';
            introText.offsetHeight; 
            introText.style.animation = 'emergeFromVoid 7s cubic-bezier(0.16, 1, 0.3, 1) forwards';

            startSequence();
        }

        window.addEventListener('DOMContentLoaded', startSequence);
    </script>
</body>
</html>
