<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The not ONE</title>
    <style>
        /* Reset et ambiance sombre absolue */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #F5F5F7;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* Écran d'introduction (le vide) */
        #intro-screen {
            position: fixed;
            inset: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 1.5s ease-out, visibility 1.5s ease-out;
        }

        /* Le texte qui s'agrandit */
        #intro-text {
            font-size: clamp(1.2rem, 3vw, 2.5rem);
            font-weight: 400;
            letter-spacing: 0.35em;
            color: #F5F5F7;
            text-shadow: 0 0 15px rgba(245, 245, 247, 0.25);
            opacity: 0;
            transform: scale(0.6);
            animation: expandIntoVoid 4.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        #intro-text span {
            font-weight: 700;
            letter-spacing: 0.45em;
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        /* Animation d'agrandissement et de dissolution */
        @keyframes expandIntoVoid {
            0% {
                opacity: 0;
                transform: scale(0.5);
                filter: blur(8px);
            }
            30% {
                opacity: 1;
                filter: blur(0px);
            }
            75% {
                opacity: 1;
                transform: scale(1.65);
                filter: blur(0px);
            }
            100% {
                opacity: 0;
                transform: scale(2.2);
                filter: blur(12px);
            }
        }

        /* Contenu principal après l'ouverture */
        #void-content {
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease-in;
            padding: 20px;
        }

        #void-content.visible {
            opacity: 1;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #555555;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
        }

        .replay-btn {
            background: transparent;
            border: 1px solid #222222;
            color: #666666;
            padding: 8px 18px;
            font-family: inherit;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .replay-btn:hover {
            border-color: #F5F5F7;
            color: #F5F5F7;
            box-shadow: 0 0 12px rgba(245, 245, 247, 0.15);
        }
    </style>
</head>
<body>

    <!-- Écran d'ouverture -->
    <div id="intro-screen">
        <h1 id="intro-text">The not <span>ONE</span></h1>
    </div>

    <!-- Ce qui apparaît une fois le vide ouvert -->
    <main id="void-content">
        <p class="subtitle">[ 0x00 — NOTHING HERE ]</p>
        <button class="replay-btn" onclick="replayIntro()">REPLAY</button>
    </main>

    <script>
        const introScreen = document.getElementById('intro-screen');
        const introText = document.getElementById('intro-text');
        const voidContent = document.getElementById('void-content');

        function startSequence() {
            // Fin de l'animation après 3.8 secondes
            setTimeout(() => {
                introScreen.style.opacity = '0';
                introScreen.style.visibility = 'hidden';
                voidContent.classList.add('visible');
            }, 3800);
        }

        function replayIntro() {
            voidContent.classList.remove('visible');
            introScreen.style.visibility = 'visible';
            introScreen.style.opacity = '1';

            // Réinitialise l'animation CSS
            introText.style.animation = 'none';
            introText.offsetHeight; /* Force le navigateur à recalculer */
            introText.style.animation = 'expandIntoVoid 4.2s cubic-bezier(0.22, 1, 0.36, 1) forwards';

            startSequence();
        }

        // Lancement automatique à l'ouverture
        window.addEventListener('DOMContentLoaded', startSequence);
    </script>
</body>
</html>
